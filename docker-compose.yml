version: '3.9'

services:
  app:
    build: .
    container_name: knowledge-hub-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
    networks:
      - khubnet

  db:
    image: postgres:16-alpine
    container_name: khub-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - khubnet

  adminer:
    image: adminer
    container_name: khub-adminer
    profiles: ["debug"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - khubnet

volumes:
  pgdata:

networks:
  khubnet:
    driver: bridge